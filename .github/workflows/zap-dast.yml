name: ZAP DAST Scan

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  zap-scan:
    runs-on: ubuntu-latest
    services:
      juice-shop:
        image: bkimminich/juice-shop
        ports:
          - 3000:3000

    steps:

      - name: Checkout
        uses: actions/checkout@v3

      - name: Wait for Juice Shop
        run: sleep 30

      - name: Run ZAP Full Scan (Docker)
        run: |
          docker run --network host \
          owasp/zap2docker-stable zap-full-scan.py \
            -t http://localhost:3000 \
            -J zap_report.json \
            -r zap_report.html

      - name: Show ZAP HTML report path
        run: |
          echo "ZAP report generated:"
          ls -alh zap_report*
